<template>
    <section class="page">
        <h1 class="page-title">{labels.faqTitle}</h1>
        <p class="intro">{labels.faqIntro}</p>
        <div class="card faq">
            <template for:each={questions} for:item="item">
                <details key={item.key} class="faq-item">
                    <summary class="faq-question">
                        <span>{item.question}</span>
                        <svg class="faq-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </summary>
                    <p class="faq-answer muted">{item.answer}</p>
                </details>
            </template>
        </div>
        <template lwc:if={hasSupportEmail}>
            <div class="card contact">
                <span class="contact-icon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="M3 7l9 6 9-6"></path>
                    </svg>
                </span>
                <div>
                    <p class="contact-title">{labels.faqContactTitle}</p>
                    <p class="muted">
                        {labels.faqContactText}
                        <a class="contact-link" href={supportHref}>{supportEmail}</a>
                    </p>
                </div>
            </div>
        </template>
    </section>
</template>
