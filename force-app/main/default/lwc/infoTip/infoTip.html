<template>
    <span class="tip" onmouseenter={show} onmouseleave={hide}>
        <button
            type="button"
            class="tip-button"
            aria-label={label}
            aria-expanded={expanded}
            aria-describedby="tip-text"
            onclick={show}
            onfocus={show}
            onblur={hide}
            onkeydown={handleKey}
        >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
            </svg>
        </button>
        <span id="tip-text" role="tooltip" class={bubbleClass}>
            <template lwc:if={hasItems}>
                <template for:each={items} for:item="item">
                    <span key={item.title} class="tip-item"><strong>{item.title}:</strong> {item.text}</span>
                </template>
            </template>
            <template lwc:else>{text}</template>
        </span>
    </span>
</template>
